name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: node --check lib/figlib.mjs && node --check lib/build.mjs && node --check examples/example_pipeline.mjs && node --check tests/smoke.mjs
        shell: bash
      - name: Run portable smoke tests
        run: node tests/smoke.mjs
      - name: Check Visio exporter syntax
        run: python -m py_compile lib/to_visio.py
      - name: Build example with strict diagnostics
        run: node lib/build.mjs examples/example_pipeline.mjs --out out/ci --no-png --strict
